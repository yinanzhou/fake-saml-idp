<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Fake SAML IdP</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .endpoint-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .endpoint-code {
      font-size: 56px;
      font-weight: 800;
      color: var(--accent-blue);
      line-height: 1;
      margin-bottom: 12px;
    }
    .endpoint-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }
    .endpoint-desc {
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 24px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand-section">
      <a href="/" style="text-decoration: none; color: inherit;">
        <div class="brand-title">Fake SAML IdP</div>
      </a>
    </div>
    <div class="header-actions">
      <a href="/" class="btn btn-sm">SSO Hub</a>
      <a href="https://github.com/yinanzhou/fake-saml-idp" target="_blank" rel="noopener noreferrer" class="btn btn-sm" title="View Source on GitHub" aria-label="GitHub Repository" style="display: inline-flex; align-items: center; justify-content: center; padding: 5px 8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle;">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
      </a>
      <button type="button" class="btn btn-sm" id="btn-toggle-theme" title="Toggle Dark/Light Mode">Theme</button>
    </div>
  </header>

  <div class="endpoint-wrapper">
    <div class="endpoint-code">Password</div>
    <h1 class="endpoint-title">Change Password Endpoint</h1>
    <p class="endpoint-desc">
      This is a fake Change Password / Self-Service Password Reset endpoint for testing SAML Service Providers.
    </p>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
      <a href="/" class="btn btn-primary btn-lg">Back to Hub</a>
      <a href="/idp-metadata.xml" class="btn btn-lg">View Metadata XML</a>
    </div>
  </div>

  <script>
    document.getElementById('btn-toggle-theme')?.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
    });
  </script>
</body>
</html>
