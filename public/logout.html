<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logout - Fake SAML IdP</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .endpoint-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .endpoint-code {
      font-size: 56px;
      font-weight: 800;
      color: var(--accent-green);
      line-height: 1;
      margin-bottom: 12px;
    }
    .endpoint-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }
    .endpoint-desc {
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 24px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand-section">
      <a href="/" style="text-decoration: none; color: inherit;">
        <div class="brand-title">Fake SAML IdP</div>
      </a>
    </div>
    <div class="header-actions">
      <a href="/" class="btn btn-sm">SSO Hub</a>
      <a href="/change-password.html" class="btn btn-sm">Password</a>
      <button type="button" class="btn btn-sm" id="btn-toggle-theme" title="Toggle Dark/Light Mode">Theme</button>
    </div>
  </header>

  <div class="endpoint-wrapper">
    <div class="endpoint-code">Logout</div>
    <h1 class="endpoint-title">Single Logout (SLO) Endpoint</h1>
    <p class="endpoint-desc">
      You have been successfully logged out. This is a fake Single Logout endpoint for testing SAML Service Providers.
    </p>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
      <a href="/" class="btn btn-primary btn-lg">Back to Hub</a>
      <a href="/idp-metadata.xml" class="btn btn-lg">View Metadata XML</a>
    </div>
  </div>

  <script>
    document.getElementById('btn-toggle-theme')?.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
    });
  </script>
</body>
</html>
